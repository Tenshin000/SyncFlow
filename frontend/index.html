<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncFlow | Redirecting...</title>
  <script type="module">
    import { getLoggedUser } from "./js/auth.js";
    const user = getLoggedUser();
    if (user) {
      const isPM = Boolean(user.is_admin) || (user.role && user.role.trim() === "Project Manager");
      window.location.replace(isPM ? "/project_manager/dashboard.html" : "/member/workspace.html");
    } else {
      window.location.replace("/login.html");
    }
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #F8FAFC;">
  <div style="text-align: center; color: #64748B;">
    <div style="font-size: 2rem; margin-bottom: 0.5rem;">⚡</div>
    <h3>Loading SyncFlow...</h3>
  </div>
</body>
</html>
